{% extends "app_base.html" %}

{% block header_actions %}
<button class="btn btn-outline btn-sm" id="review-refresh-button" type="button">
    Refresh
</button>
{% endblock %}

{% block content %}
<div class="app-workspace" id="review-queue-workspace" data-operator="{{ username|default('') }}">
    <p>Review documents that need attention. Completed reviews are available in History.</p>
    <div class="flex items-center gap-2 flex-wrap" aria-label="Review views">
        <button class="btn btn-primary btn-sm review-filter" data-filter="active" type="button">Needs review <span id="review-count-active">0</span></button>
        <button class="btn btn-outline btn-sm review-filter" data-filter="completed" type="button">History <span id="review-count-completed">0</span></button>
    </div>
    <div id="review-ownership" class="flex items-center gap-2 flex-wrap" aria-label="Ownership filters">
        <button class="btn btn-outline btn-sm review-filter" data-filter="active" type="button">All active</button>
        <button class="btn btn-outline btn-sm review-filter" data-filter="unclaimed" type="button">Unclaimed <span id="review-count-unclaimed">0</span></button>
        <button class="btn btn-outline btn-sm review-filter" data-filter="mine" type="button">Assigned to me <span id="review-count-mine">0</span></button>
        <button class="btn btn-outline btn-sm review-filter" data-filter="others" type="button">Claimed by others <span id="review-count-others">0</span></button>
    </div>
    <div class="app-filter-bar">
        <select id="review-pipeline" class="select select-bordered select-sm" aria-label="Pipeline"><option value="">All pipelines</option></select>
        <label class="input input-bordered input-sm flex items-center gap-2">
            <svg class="w-4 h-4 text-base-content/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input type="search" class="grow" id="review-search-input" placeholder="Search documents..." aria-label="Search documents" />
        </label>
    </div>

    <section id="review-queue-region" class="app-table-region app-queue-table-region" role="region" aria-labelledby="review-queue-table-heading" aria-busy="true">
        <h2 id="review-queue-table-heading" class="sr-only">Review queue items</h2>
        <table class="table table-sm table-zebra app-queue-table">
            <thead>
                <tr>
                    <th><button class="btn btn-ghost btn-xs" data-review-sort="document" type="button">Document <span aria-hidden="true"></span></button></th>
                    <th><button class="btn btn-ghost btn-xs" data-review-sort="pipeline" type="button">Pipeline <span aria-hidden="true"></span></button></th>
                    <th><button class="btn btn-ghost btn-xs" data-review-sort="fields" type="button">Fields to check <span aria-hidden="true"></span></button></th>
                    <th><button class="btn btn-ghost btn-xs" data-review-sort="confidence" type="button">Lowest Confidence <span aria-hidden="true"></span></button></th>
                    <th><button class="btn btn-ghost btn-xs" data-review-sort="created_at" type="button">Queued at <span aria-hidden="true"></span></button></th>
                    <th><button class="btn btn-ghost btn-xs" data-review-sort="status" type="button">Status <span aria-hidden="true"></span></button></th>
                    <th class="text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="review-queue-body" aria-busy="true">
                <tr aria-hidden="true"><td colspan="7"><div class="grid grid-cols-3 gap-3"><span class="placeholder-row w-4/5"></span><span class="placeholder-row w-3/5"></span><span class="placeholder-row w-2/5"></span></div></td></tr>
                <tr aria-hidden="true"><td colspan="7"><div class="grid grid-cols-3 gap-3"><span class="placeholder-row w-3/5"></span><span class="placeholder-row w-4/5"></span><span class="placeholder-row w-2/5"></span></div></td></tr>
                <tr aria-hidden="true"><td colspan="7"><div class="grid grid-cols-3 gap-3"><span class="placeholder-row w-2/5"></span><span class="placeholder-row w-3/5"></span><span class="placeholder-row w-4/5"></span></div></td></tr>
            </tbody>
        </table>
        <div class="flex items-center justify-between gap-3 p-3 border-t border-base-200" id="review-pagination">
            <span class="text-xs text-base-content/60" id="review-page-summary">Loading</span>
            <label>Rows per page <select id="review-page-size" class="select select-bordered select-sm"><option>10</option><option selected>25</option><option>50</option><option>100</option></select></label>
            <div class="join">
                <button class="btn btn-outline btn-sm join-item" id="review-prev" type="button">Previous</button>
                <button class="btn btn-outline btn-sm join-item" id="review-next" type="button">Next</button>
            </div>
        </div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/review_queue.js?v=actionable-queue" defer></script>
{% endblock %}
