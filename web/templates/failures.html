{% extends "app_base.html" %}

{% block content %}
<div id="failures-workspace" class="app-workspace">
    <section class="card bg-base-100 shadow-sm">
        <div class="card-body">
            <div class="flex items-center justify-between gap-3 mb-3">
                <h2 class="font-semibold">Failed Documents</h2>
                <span id="failures-count" class="badge badge-error badge-sm">0</span>
            </div>
            <div class="overflow-x-auto">
                <table class="table table-sm">
                    <thead>
                        <tr class="text-xs text-base-content/50">
                            <th><button class="btn btn-ghost btn-xs" data-failure-sort="document" type="button">Document <span aria-hidden="true"></span></button></th>
                            <th><button class="btn btn-ghost btn-xs" data-failure-sort="task" type="button">Failed Task <span aria-hidden="true"></span></button></th>
                            <th><button class="btn btn-ghost btn-xs" data-failure-sort="error" type="button">Error <span aria-hidden="true"></span></button></th>
                            <th><button class="btn btn-ghost btn-xs" data-failure-sort="failure_at" type="button">Failed At <span aria-hidden="true"></span></button></th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="failures-table-body">
                        <tr>
                            <td colspan="5" class="text-center text-base-content/50 py-10">Loading failures</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="flex items-center justify-between gap-3 mt-3" id="failures-pagination">
                <span class="text-xs text-base-content/60" id="failures-page-summary">Loading</span>
                <div class="join">
                    <button class="btn btn-outline btn-sm join-item" id="failures-prev" type="button">Previous</button>
                    <button class="btn btn-outline btn-sm join-item" id="failures-next" type="button">Next</button>
                </div>
            </div>
        </div>
    </section>

    <section class="card bg-base-100 shadow-sm">
        <div class="card-body">
            <div class="flex items-center justify-between gap-3 mb-3">
                <div class="min-w-0">
                    <h2 id="failure-detail-title" class="font-semibold truncate">Failure Detail</h2>
                    <p id="failure-detail-subtitle" class="text-xs text-base-content/50">Select a failed document</p>
                </div>
                <a id="failure-source-link" class="btn btn-outline btn-sm hidden" href="#" target="_blank" rel="noopener">Open Source PDF</a>
            </div>
            <div id="failure-detail-body" class="grid gap-4 lg:grid-cols-2">
                <div class="empty-panel lg:col-span-2">Select a failure to inspect the source PDF and task error.</div>
            </div>
        </div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/pdf_viewer.js?v=pdfjs-4-10-38" defer></script>
<script src="/static/js/failures.js?v=pagination-sort" defer></script>
{% endblock %}
